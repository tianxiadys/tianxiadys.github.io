name: ForgejoBuilder
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ForgejoBuilder/**
      - .github/workflows/ForgejoBuilder.yml
jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Setup
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Docker Build And Push
        uses: docker/build-push-action@v5
        with:
          context: .github/workflows/ForgejoBuilder
          push: true
          tags: |
            tianxiadys/builder:1.0.0
            tianxiadys/builder:latest
